<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title></title>
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" width="28" height="28" />
      <h1 id="title"></h1>
      <span id="version"></span>
    </header>
    <main>
      <p id="message" role="status" aria-live="polite"></p>
      <p id="hint" hidden><code id="command"></code></p>
      <details id="detailbox" hidden>
        <summary id="detailsummary"></summary>
        <p id="detail"></p>
      </details>
      <button id="trace" class="card" type="button" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M5 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm14-10a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM7 17h6a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span id="tracelabel"></span>
      </button>
      <div id="result" hidden>
        <textarea id="line" readonly rows="4"></textarea>
        <button id="copy" type="button"></button>
        <p id="copynote" role="status" hidden></p>
      </div>
      <section id="site" hidden>
        <h2 id="sitetitle"></h2>
        <div class="row">
          <span id="sitelabel"></span>
          <button
            id="sitetoggle"
            class="switch"
            type="button"
            role="switch"
            aria-checked="false"
            aria-labelledby="sitelabel"
          ></button>
        </div>
        <p id="sitetext"></p>
        <p id="sitenote" role="status" hidden></p>
      </section>
    </main>
    <section id="helppanel" class="panel" hidden>
      <h2 id="helpsummary"></h2>
      <h3 id="helpnohosttitle"></h3>
      <p id="helpnohost"></p>
      <h3 id="helpoldtitle"></h3>
      <p id="helpold"></p>
      <h3 id="helppagetitle"></h3>
      <p id="helppage"></p>
    </section>
    <section id="aboutpanel" class="panel" hidden>
      <h2 id="aboutsummary"></h2>
      <p id="aboutversion"></p>
      <p id="aboutdescription"></p>
      <h3 id="abouthowtitle"></h3>
      <p id="abouthow"></p>
      <h3 id="aboutprivacytitle"></h3>
      <p id="aboutprivacy"></p>
      <ul id="aboutlinks">
        <li>
          <a
            id="linkrepo"
            href="https://github.com/HyakoV3/librespeed-route"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
        </li>
        <li>
          <a
            id="linkreleases"
            href="https://github.com/HyakoV3/librespeed-route/releases"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
        </li>
        <li>
          <a
            id="linklicense"
            href="https://github.com/HyakoV3/librespeed-route#licence"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
        </li>
      </ul>
    </section>
    <footer>
      <button
        id="helpbutton"
        class="link"
        type="button"
        aria-expanded="false"
        aria-controls="helppanel"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="9"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span id="helplabel"></span>
      </button>
      <button
        id="aboutbutton"
        class="link"
        type="button"
        aria-expanded="false"
        aria-controls="aboutpanel"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="9"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M12 11v6M12 7.5h.01"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span id="aboutlabel"></span>
      </button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
