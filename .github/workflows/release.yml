name: release

# A tag "vX.Y.Z" builds the binaries for Windows, macOS and Linux and puts them in the release of the tag, with checksums.txt.
# Nothing is signed or notarized (see the README: SmartScreen and Gatekeeper may warn).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The two zips of the extension (the version of the manifest is the one of the tag)
        run: |
          go run ./cmd/extbuild -version "${GITHUB_REF_NAME#v}" -zip -out extension-dist
          # The same extension with the key of development, to be loaded from a folder (the id that the program lets in) until there is one in a store
          go run ./cmd/extbuild -dev -version "${GITHUB_REF_NAME#v}" -zip -out extension-sideload
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
