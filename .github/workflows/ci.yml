name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The program has no dependencies, so there is no go.sum to key a cache on
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The copy of the page parser is the one that is pinned
        shell: bash
        run: |
          expected=$(grep -o 'sha256 [0-9a-f]\{64\}' testdata/PIN | head -1 | cut -d' ' -f2)
          actual=$(node -e 'console.log(require("crypto").createHash("sha256").update(require("fs").readFileSync("testdata/web/route-parse.js")).digest("hex"))')
          test "$expected" = "$actual"
      - run: go vet ./...
      - run: go test ./...
      - name: The real tool of the system, on the loopback
        run: go test -run "Loopback" -v ./internal/route/
        env:
          LSROUTE_LIVE: "1"
      - name: Raw output of the real tool towards a public address (a sample to download)
        run: go test -run DumpTheRawOutput -v ./internal/route/
        env:
          LSROUTE_DUMP: ${{ github.workspace }}/samples
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: samples-${{ matrix.os }}
          path: samples
          if-no-files-found: ignore
      - name: Build
        run: go build -o librespeed-route ./cmd/librespeed-route
      - name: The command traces the loopback
        shell: bash
        run: |
          # The command refuses non-public addresses on purpose: the exit code 2 is the answer
          ./librespeed-route 127.0.0.1 || test $? -eq 2
          ./librespeed-route --version

  extension:
    # The extension in the Chromium of Playwright, with the real program built with -tags e2efake (no network)
    # Pinned: Playwright does not support the Ubuntu 26.04 that ubuntu-latest now points to
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The extension builds, and the zip is the same bytes twice
        run: |
          go run ./cmd/extbuild -version 0.0.1 -zip -out /tmp/a
          go run ./cmd/extbuild -version 0.0.1 -zip -out /tmp/b
          cmp /tmp/a/librespeed-route-extension-chromium-0.0.1.zip /tmp/b/librespeed-route-extension-chromium-0.0.1.zip
          cmp /tmp/a/librespeed-route-extension-firefox-0.0.1.zip /tmp/b/librespeed-route-extension-firefox-0.0.1.zip
          # The zip for the store has no development key
          ! unzip -p /tmp/a/librespeed-route-extension-chromium-0.0.1.zip manifest.json | grep -q '"key"'
          # The one to load from a folder has it, and says so in its name
          go run ./cmd/extbuild -dev -version 0.0.1 -zip -out /tmp/c
          unzip -p /tmp/c/librespeed-route-extension-chromium-sideload-0.0.1.zip manifest.json | grep -q '"key"'
      - name: Install the browser and the test tools
        working-directory: extension
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End to end
        working-directory: extension
        run: npx playwright test
